<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
    </head>
    <body>
        <div style="background-color: gold; border: 5px solid;">
            padding & margin 介紹
        </div>
        <br/>
        <div style="padding: 20px; background-color: gold; border: 5px solid;">
            padding: 20px
        </div>
        <br/>
        <div style="padding-top: 20px; background-color: gold; border: 5px solid;">
            padding-top: 20px
        </div>
        <br/>
        <div style="padding-bottom: 20px; background-color: gold; border: 5px solid;">
            padding-bottom: 20px
        </div>  
        <br/>   
        <div style="padding-left: 20px; background-color: gold; border: 5px solid;">
            padding-left: 20px
        </div>
        <br/>   
        <div style="margin: 20px; padding-left: 20px; background-color: gold; border: 5px solid;">
            padding-left: 20px
            margin: 20px
        </div>  
        <br/>   
        <div style="margin-top: 20px; padding-left: 20px; background-color: gold; border: 5px solid;">
            padding-left: 20px
            margin-top: 20px
        </div>   
        <br/>   
        <div style="padding: 20px 30px 40px 50px; background-color: gold; border: 5px solid;">
            <p style="background-color: chocolate;">padding: 20px 30px 40px 50px</p>
        </div>       
        <br/>   
        <div style="margin-top: -15px; background-color: gold; border: 5px solid;">
            <p style="background-color: chocolate;">margin-top: -15px, 發現與上個區塊的分行間隔變短了</p>
        </div>                          
    </body>
</html>
