    <body style="height: 1500px;">
        <p style="position: relative; top: 70px; left: 10px;">1.原始狀態, 重疊 看不清楚</p>

        <br/>
        
        <p style="position: relative; top: 70px; left: 10px;">2.透明度50%, 已可看清文字</p>

        <div style="border-radius: 10px; background-color: gold; height: 100px; width: 100px;">圓邊</div> 
        <br/>

        <div style="border-radius: 50px; background-color: gold; height: 100px; width: 100px;">border-radius 設為半徑, 就變正圓</div> 
        <br/>        
    </body>
